# Site settings
locale          : "en-US"
site_theme      : "default"
title           : "About"
title_separator : "-"
name            : &name "Malte Willmes"
description     : &description "Researcher in wildlife ecology, geochemistry, and archaeology"
url             : "https://maltewillmes.github.io"
baseurl         : ""
repository      : "MalteWillmes/maltewillmes.github.io"


# Author profile
author:
  avatar        : "profile.png"
  name          : "Malte Willmes"
  description   : "Wildlife ecology and geochemistry"
  pronouns      : "him/his"
  bio           : "I am a researcher in ecology, geochemistry, and archaeology"
  location      : "Trondheim, Norway"
  employer      : "NINA"
  email         : "malte.willmes@nina.no"

  googlescholar : "UmtrMTUAAAAJ"
  orcid         : "0000-0001-8734-5324"
  github        : "maltewillmes"
  bluesky       : "rocksandbones.bsky.social"


# General site behavior
breadcrumbs : false
future      : true
read_more   : "disabled"


# Files included in the generated site
include:
  - _pages
  - files


# Source/build files that should not be copied into _site
exclude:
  - .github
  - .jekyll-cache
  - .sass-cache
  - node_modules
  - scripts
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - assets/js/theme.js
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - package.json
  - package-lock.json


# Markdown processing
markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo


# Content collections
collections:
  research:
    output: false

  presentations:
    output: false


# Default front matter
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

  - scope:
      path: ""
      type: research
    values:
      author_profile: false


# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed


# Output
permalink: /:categories/:title/
timezone: Etc/UTC


# Plugins
plugins:
  - jekyll-sitemap


# HTML compression
compress_html:
  clippings: all
  ignore:
    envs: development
